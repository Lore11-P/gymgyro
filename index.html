<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymGyro">
  <meta name="theme-color" content="#080b10">
  <meta name="format-detection" content="telephone=no">
  <meta name="description" content="GymGyro — conta le ripetizioni con accelerometro e giroscopio dell'iPhone, gestisce recuperi, scheda e cronologia.">
  <title>GymGyro</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="8"></circle>
            <circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"></circle>
            <circle cx="19.2" cy="6.4" r="1.7" fill="currentColor" stroke="none"></circle>
            <circle cx="4.4" cy="16.8" r="1.3" fill="currentColor" stroke="none"></circle>
          </svg>
        </span>
        <div class="brand-text">
          <h1>GymGyro</h1>
          <p>Ripetizioni, recuperi, progressi.</p>
        </div>
      </div>
      <span class="brand-chip">iOS · Sensori</span>
    </header>
    <main id="view" class="view"></main>
  </div>

  <nav class="tabbar" aria-label="Navigazione principale">
    <button class="tab active" data-action="tab" data-tab="today">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 9v6M6.7 7v10M17.3 7v10M19.5 9v6M6.7 12h10.6"></path>
      </svg>
      <span>Oggi</span>
    </button>
    <button class="tab" data-action="tab" data-tab="plan">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <rect x="5" y="4.5" width="14" height="17" rx="2.5"></rect>
        <path d="M9 4.5V7h6V4.5"></path>
        <path d="M8.5 11.5h7M8.5 15.5h4.5"></path>
      </svg>
      <span>Scheda</span>
    </button>
    <button class="tab" data-action="tab" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.5"></circle>
        <path d="M12 7.5V12l3.2 1.9"></path>
      </svg>
      <span>Storico</span>
    </button>
    <button class="tab" data-action="tab" data-tab="settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 7h9M17.5 7H20M4 17h2.5M11 17h9"></path>
        <circle cx="15" cy="7" r="2.4"></circle>
        <circle cx="8.5" cy="17" r="2.4"></circle>
      </svg>
      <span>Opzioni</span>
    </button>
  </nav>

  <div id="workout-root"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js" defer></script>
</body>
</html>
